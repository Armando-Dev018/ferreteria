<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión - SysFerretería</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #525d65;
        }
        .card-login {
            background-color: #f25c05;
            border-radius: 24px;
            box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.35);
        }
        .watermark-icon {
            position: absolute;
            color: rgba(255, 255, 255, 0.08);
            pointer-events: none;
            user-select: none;
        }
        input:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden select-none">

    <i class="fa-solid fa-hammer watermark-icon text-7xl top-1/3 left-1/4 transform -rotate-45"></i>
    <i class="fa-solid fa-wrench watermark-icon text-7xl top-1/3 right-1/4 transform rotate-45"></i>
    <i class="fa-solid fa-screwdriver-wrench watermark-icon text-7xl bottom-1/4 right-1/3 transform rotate-12"></i>

    <main class="w-full max-w-[420px] card-login p-8 text-white relative z-10">
        
        <div class="flex justify-center items-center mb-6 pt-2">
            <svg class="h-20 w-auto drop-shadow-sm" viewBox="0 0 320 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <g fill="#FFFFFF">
                    <path d="M 195,40 C 195,22 210,10 230,10 C 250,10 265,22 265,40 L 272,40 C 275,40 275,45 272,45 L 188,45 C 185,45 185,40 188,40 Z" />
                    <rect x="225" y="5" width="10" height="12" rx="2" />
                    <path d="M 235,30 C 235,17 247,8 262,8 C 277,8 289,17 289,30 L 294,30 C 297,30 297,34 294,34 L 228,34 C 225,34 225,30 228,30 Z" opacity="0.85"/>
                </g>
                <g fill="#4a5568" stroke="#4a5568" stroke-width="2">
                    <path d="M 60,30 C 40,30 25,45 25,60 C 25,75 40,90 60,90 L 110,90 C 115,90 115,80 110,80 L 60,80 C 48,80 37,70 37,60 C 37,50 48,40 60,40 L 110,40 C 115,40 115,30 110,30 Z" />
                    <path d="M 105,90 L 105,35 L 135,70 L 165,35 L 165,90 L 180,90 L 180,30 L 165,30 L 135,65 L 105,30 L 90,30 L 90,90 Z" />
                </g>
            </svg>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div class="space-y-1">
                <label for="username" class="block text-sm font-medium text-white">
                    Usuario o correo electrónico
                </label>
                <input 
                    type="text" 
                    id="username" 
                    value="admin_cabrera"
                    required 
                    autofocus
                    class="w-full px-4 py-2.5 bg-white text-gray-800 rounded-xl text-sm font-normal focus:outline-none transition shadow-sm"
                >
            </div>

            <div class="space-y-1">
                <div class="flex justify-between items-center text-sm">
                    <label for="password" class="font-medium text-white">Contraseña</label>
                </div>
                <div class="relative">
                    <input 
                        type="password" 
                        id="password" 
                        value="admin"
                        required 
                        class="w-full pl-4 pr-10 py-2.5 bg-white text-gray-800 rounded-xl text-sm font-normal focus:outline-none transition shadow-sm"
                    >
                    <button 
                        type="button" 
                        onclick="togglePasswordVisibility()" 
                        class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-500 hover:text-gray-700 transition"
                    >
                        <i id="eyeIcon" class="fa-solid fa-eye-slash text-sm"></i>
                    </button>
                </div>
            </div>

            <div class="pt-2">
                <button 
                    type="submit" 
                    class="w-full py-2.5 px-4 bg-white text-gray-800 font-semibold rounded-full text-sm shadow hover:bg-gray-50 active:scale-[0.98] transition duration-150"
                >
                    Entrar al Sistema
                </button>
            </div>
        </form>

        <div class="mt-6 pt-2 flex items-center justify-center space-x-3 text-sm">
            <span class="text-white font-normal">¿Eres nuevo encargado?</span>
            <a 
                href="registro.html" 
                class="px-5 py-1.5 bg-white text-gray-800 font-medium text-xs rounded-full shadow hover:bg-gray-50 transition active:scale-95"
            >
                Regístrate
            </a>
        </div>
    </main>

    <div id="loginModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 text-gray-800 text-center shadow-2xl space-y-4">
            <div class="w-12 h-12 rounded-full bg-orange-100 text-[#f25c05] mx-auto flex items-center justify-center text-xl">
                <i class="fa-solid fa-right-to-bracket"></i>
            </div>
            <h3 class="text-lg font-bold text-gray-900">Acceso Autorizado</h3>
            <p id="modalMessage" class="text-sm text-gray-600">Accediendo a SysFerretería...</p>
        </div>
    </div>

    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('http://localhost:3000/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                if (!res.ok || !data.ok) {
                    alert(data.mensaje || 'Credenciales incorrectas.');
                    return;
                }

                localStorage.setItem('sysferreteria_user', JSON.stringify(data.usuario));
                document.getElementById('modalMessage').textContent = `¡Bienvenido, ${data.usuario.nombre_completo || data.usuario.nombre_usuario}! Cargando módulos...`;
                document.getElementById('loginModal').classList.remove('hidden');

                setTimeout(() => {
                    window.location.href = 'sysferreter_a_sistema_principal.html';
                }, 1000);
            } catch (err) {
                alert('Error al conectar con el servidor Node.js (Verifica que ejecutaste npm start): ' + err.message);
            }
        }
    </script>
</body>
</html>
